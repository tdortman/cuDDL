[package]
edition = "2021"
name = "needletail"
version = "0.5.1"
authors = [
    "Roderick Bovee <rbovee@gmail.com>",
    "Vincent Prouillet <vincent@onecodex.com>",
]
include = [
    "src/**/*",
    "LICENSE",
    "README.md",
    "CHANGELOG.md",
]
description = "FASTX parsing and k-mer methods"
readme = "./README.md"
keywords = [
    "FASTA",
    "FASTQ",
    "kmer",
    "bioinformatics",
]
categories = [
    "science",
    "parsing",
]
license = "MIT"
repository = "https://github.com/onecodex/needletail"

[profile.release]
lto = true

[lib]
